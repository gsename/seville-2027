const RATIO = { bailaora: 140 / 220, toro: 236 / 210, torero: 200 / 210 };
const TOUR = [{ transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }, { transform: 'scaleX(-1)' }, { transform: 'scaleX(1)' }];
let paradeGen = 0;
const melange = a => [...a].sort(() => Math.random() - .5);

/* Une scène : largeur d'écran, hauteur de la bande, sens (1 = de gauche à droite, -1 = miroir).
   Les positions sont données pour le sens 1, en px, au centre de chaque personnage. */
function nouvelleScene() {
  const H = $('#parade').clientHeight / 1.55;
  return { dir: Math.random() < .5 ? 1 : -1, W: window.innerWidth, H, k: H / 210, gen: paradeGen, total: 0 };
}
const largeur = (s, nom) => s.H * RATIO[nom];
const horsG = w => -w / 2 - 30;
const horsD = (s, w) => s.W + w / 2 + 30;
const vitTaureau = s => Math.max(330, s.W / 3.5) / 1000; /* px par ms */
const vitDanse = s => Math.max(95, s.W / 9) / 1000;
/* Gestes (muleta, ¡Olé!…) calés sur le départ réel des animations de la scène */
function at(s, ms, fn) {
  (s.pret || Promise.resolve()).then(() => setTimeout(() => { if (s.gen === paradeGen) fn(); }, Math.max(0, ms)), () => {});
}

/* Place un personnage et le fait se déplacer. pts : [ms, x, f, easing?], f = 1 sens du dessin, -1 retourné */
function acteur(s, html, nom, pts, { z = 1, cls = '' } = {}) {
  const w = largeur(s, nom);
  const el = document.createElement('div');
  el.className = 'acteur' + (cls ? ' ' + cls : '');
  el.style.width = w + 'px';
  el.style.zIndex = z;
  el.innerHTML = `<div class="tour">${html}</div>`;
  $('#parade').appendChild(el);
  const kf = pts.map(([ms, x, f, easing]) => {
    const X = s.dir > 0 ? x : s.W - x, F = s.dir > 0 ? f : -f;
    const k = { transform: `translateX(${(X - w / 2).toFixed(1)}px) scaleX(${F})`, offset: Math.min(1, Math.max(0, ms / s.total)) };
    if (easing) k.easing = easing;
    return k;
  });
  if (kf[0].offset > 0) kf.unshift({ transform: kf[0].transform, offset: 0 });
  if (kf[kf.length - 1].offset < 1) kf.push({ transform: kf[kf.length - 1].transform, offset: 1 });
  const a = el.animate(kf, { duration: s.total, easing: 'linear', fill: 'both' });
  if (!s.pret) s.pret = a.ready;
  a.finished.then(() => el.remove(), () => el.remove());
  return el;
}
function bulle(s, texte, x, ms) {
  at(s, ms, () => {
    const b = document.createElement('span');
    b.className = 'bulle';
    b.textContent = texte;
    b.style.left = (s.dir > 0 ? x : s.W - x) + 'px';
    $('#parade').appendChild(b);
    b.animate([
      { opacity: 0, transform: 'translateX(-50%) translateY(12px) scale(.6)' },
      { opacity: 1, transform: 'translateX(-50%) translateY(0) scale(1.12)', offset: .2 },
      { opacity: 1, transform: 'translateX(-50%) translateY(-4px) scale(1)', offset: .75 },
      { opacity: 0, transform: 'translateX(-50%) translateY(-16px) scale(1)' }
    ], { duration: 1500, easing: 'ease-out', fill: 'both' }).finished.then(() => b.remove(), () => b.remove());
  });
}

/* 1. Une ou deux bailaoras traversent en dansant, avec une vuelta au milieu */
function sceneBailaoras(s, { n: nForce, texte } = {}) {
  const wD = largeur(s, 'bailaora'), n = nForce || (Math.random() < .45 ? 2 : 1), ecart = 1300;
  const x0 = horsG(wD), x1 = horsD(s, wD), dist = x1 - x0, dur = dist / vitDanse(s);
  s.total = dur + ecart * (n - 1);
  melange(ROBES).slice(0, n).forEach((robe, i) => {
    const t0 = i * ecart;
    const el = acteur(s, bailaoraSvg(robe), 'bailaora',
      [[t0, x0, 1], [t0 + dur * .44, x0 + dist * .46, 1], [t0 + dur * .6, x0 + dist * .52, 1], [t0 + dur, x1, 1]], { z: 3 + i });
    at(s, t0 + dur * .44, () => el.querySelector('.tour').animate(TOUR, { duration: dur * .16, easing: 'ease-in-out' }));
  });
  if (texte) bulle(s, texte, x0 + dist * .48, dur * .44);
}

/* 2. Le taureau charge la muleta d'un torero qui recule en courant */
function sceneCharge(s) {
  const wB = largeur(s, 'toro'), wT = largeur(s, 'torero'), v = vitTaureau(s), ecart = 190 * s.k;
  const b0 = horsG(wB) - ecart, t0 = b0 + ecart;
  const d = Math.max(horsD(s, wT) - t0, horsD(s, wB) - b0);
  s.total = d / v;
  acteur(s, toroSvg(), 'toro', [[0, b0, 1], [s.total, b0 + d, 1]], { z: 1 });
  acteur(s, toreroSvg(), 'torero', [[0, t0, 1], [s.total, t0 + d, 1]], { z: 2, cls: 'court' });
  bulle(s, '¡Olé!', s.W * .5, s.total * .45);
}

/* 3. Les passes : le torero s'arrête au milieu, lève la muleta et fait passer le taureau,
   qui fait demi-tour hors champ et revient pour une deuxième passe. Puis desplante et ¡Olé! */
function scenePases(s) {
  const { W, k } = s, wB = largeur(s, 'toro'), wT = largeur(s, 'torero'), v = vitTaureau(s), vMarche = .12;
  const c = W * .55, xBG = horsG(wB), xBD = horsD(s, wB), xTD = horsD(s, wT);
  const tArr = 2200;
  const t1s = 1900, t1e = t1s + (xBD - xBG) / v;
  const hit1 = t1s + (c - 165 * k - xBG) / v, out1 = t1s + (c + 120 * k - xBG) / v;
  const t2s = t1e + 900, t2e = t2s + (xBD - xBG) / v;
  const hit2 = t2s + (xBD - (c + 165 * k)) / v, out2 = t2s + (xBD - (c - 120 * k)) / v;
  const tTour = out1 + 450, tDes = out2 + 200, tPart = tDes + 1700, tFin = tPart + (xTD - c) / vMarche;
  s.total = Math.max(tFin, t2e) + 50;
  acteur(s, toroSvg(), 'toro',
    [[t1s, xBG, 1], [t1e, xBD, 1], [t1e + 450, xBD, 1], [t1e + 451, xBD, -1], [t2s, xBD, -1], [t2e, xBG, -1]], { z: 1 });
  const tor = acteur(s, toreroSvg(), 'torero',
    [[0, xTD, 1, 'ease-out'], [tArr, c, 1], [tTour, c, 1], [tTour + 1, c, -1], [tPart, c, -1], [tFin, xTD, -1]], { z: 2, cls: 'marche' });
  at(s, tArr, () => tor.classList.remove('marche'));
  at(s, hit1 - 380, () => tor.classList.add('pase'));
  at(s, out1, () => tor.classList.remove('pase'));
  bulle(s, '¡Olé!', c, out1 - 150);
  at(s, hit2 - 380, () => tor.classList.add('pase'));
  at(s, out2, () => tor.classList.remove('pase'));
  at(s, tDes, () => tor.classList.add('desplante'));
  bulle(s, '¡Olé!', c, tDes + 100);
  at(s, tPart, () => { tor.classList.remove('desplante'); tor.classList.add('marche'); });
}

/* 4. La poursuite : les bailaoras arrivent en dansant, voient le taureau et s'enfuient,
   le taureau leur court après, et le torero court derrière en agitant la muleta */
function scenePoursuite(s) {
  const { W, k } = s, wD = largeur(s, 'bailaora'), wB = largeur(s, 'toro'), wT = largeur(s, 'torero');
  const vD = vitDanse(s), vB = vitTaureau(s), vF = vB * .92, vT = vB * .82;
  const n = Math.random() < .5 ? 2 : 1, g = wD * .75;
  const xStop = W * .45, xDG = horsG(wD), xFin = horsD(s, wD) + (n - 1) * g;
  const tA = (xStop - xDG) / vD;
  const danseuses = melange(ROBES).slice(0, n).map((robe, i) => {
    const xa = xStop - i * g;
    return { robe, x0: xDG - i * g, xa, tEnd: tA + (xFin - xa) / vF };
  });
  /* Le taureau reste assez loin derrière la dernière danseuse pour ne jamais la rattraper */
  const xB = horsG(wB), bTA = xStop - (n - 1) * g - wD * .3 - 90 * k - 90;
  const tB0 = tA - (bTA - xB) / vB, tBEnd = tB0 + (horsD(s, wB) - xB) / vB;
  const xTG = horsG(wT), tT0 = tB0 + 1000, tTEnd = tT0 + (horsD(s, wT) - xTG) / vT;
  s.total = Math.max(...danseuses.map(dz => dz.tEnd), tBEnd, tTEnd) + 50;
  danseuses.forEach((dz, i) => {
    const el = acteur(s, bailaoraSvg(dz.robe), 'bailaora', [[0, dz.x0, 1], [tA, dz.xa, 1], [dz.tEnd, xFin, 1]], { z: 3 + i });
    at(s, tA - 100, () => el.classList.add('fuite'));
  });
  bulle(s, '¡Ay!', xStop, tA - 250);
  acteur(s, toroSvg(), 'toro', [[Math.max(0, tB0), xB + Math.max(0, -tB0) * vB, 1], [tBEnd, horsD(s, wB), 1]], { z: 2 });
  acteur(s, toreroSvg(), 'torero', [[tT0, xTG, -1], [tTEnd, horsD(s, wT), -1]], { z: 1, cls: 'court pase' });
  bulle(s, '¡Eh, toro!', W * .5, tT0 + (W * .5 - xTG) / vT - 400);
}

/* 5. Le choc : le taureau fonce dans le bord de l'écran, toute la page tremble, il reste sonné puis repart au trot */
function tremble() {
  document.body.classList.remove('tremble');
  void document.body.offsetWidth;
  document.body.classList.add('tremble');
  setTimeout(() => document.body.classList.remove('tremble'), 650);
  try { if (navigator.vibrate) navigator.vibrate(120); } catch { /* pas de vibreur */ }
}
function sceneChoc(s) {
  const { W, k } = s, wB = largeur(s, 'toro'), v = vitTaureau(s) * 1.15, vTrot = v * .35;
  const xBG = horsG(wB), xImpact = W - 96 * k, xRebond = xImpact - 34 * k;
  const tI = (xImpact - xBG) / v, tE = tI + 2700, tFin = tE + 450 + (xRebond - xBG) / vTrot;
  s.total = tFin + 50;
  const toro = acteur(s, toroSvg(), 'toro',
    [[0, xBG, 1], [tI, xImpact, 1, 'ease-out'], [tI + 280, xRebond, 1], [tE, xRebond, 1], [tE + 1, xRebond, -1], [tE + 450, xRebond, -1], [tFin, xBG, -1]], { z: 2 });
  const tour = toro.querySelector('.tour');
  tour.style.transformOrigin = '88% 60%';
  at(s, tI, () => {
    tremble();
    tour.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(.8) scaleY(1.06)', offset: .3 }, { transform: 'scaleX(1)' }], { duration: 380, easing: 'ease-out' });
    toro.classList.add('etourdi');
  });
  bulle(s, '¡Bum!', W - 80 * k, tI - 60);
  at(s, tE, () => { toro.classList.remove('etourdi'); toro.classList.add('trot'); });
}

/* 6. Le salto : le taureau ignore la muleta et percute le torero, qui fait un salto arrière,
   retombe sur les fesses, se relève et s'enfuit de l'autre côté. Sa muleta s'envole et flotte jusqu'à sortir de l'écran. */
function sceneSalto(s) {
  const { W, k } = s, wB = largeur(s, 'toro'), wT = largeur(s, 'torero'), v = vitTaureau(s), vCapa = Math.max(.09, W / 9000);
  const c = W * .5, xTD = horsD(s, wT), xTG = horsG(wT), xBG = horsG(wB), xBD = horsD(s, wB);
  const tArr = 2000, t1s = 1700;
  const tI = t1s + (c - 107 * k - xBG) / v, tB = t1s + (xBD - xBG) / v;
  const xAtt = c + 130 * k, tAtt = tI + 750, tLeve = tAtt + 1400, tFuite = tLeve + 200 + (xAtt - xTG) / (v * .75);
  const tCapa = tI + (xTD - c) / vCapa;
  s.total = Math.max(tB, tFuite, tCapa) + 50;
  acteur(s, toroSvg(), 'toro', [[t1s, xBG, 1], [tB, xBD, 1]], { z: 2 });
  const tor = acteur(s, toreroSvg(), 'torero',
    [[0, xTD, 1, 'ease-out'], [tArr, c, 1], [tI, c, 1, 'ease-out'], [tAtt, xAtt, 1], [tLeve + 200, xAtt, 1], [tFuite, xTG, 1]], { z: 3, cls: 'marche' });
  const capa = acteur(s, capaSvg(), 'torero', [[tI, c, 1], [tCapa, xTD, 1]], { z: 4 });
  capa.style.opacity = '0';
  at(s, tArr, () => tor.classList.remove('marche'));
  at(s, tI - 140, () => tor.classList.add('pase')); /* trop tard… */
  at(s, tI, () => {
    tor.classList.remove('pase');
    tor.classList.add('sans-capa');
    tor.querySelector('.tour').animate([
      { transform: 'translateY(0) rotate(0deg)' },
      { transform: 'translateY(-48%) rotate(190deg)', offset: .5 },
      { transform: 'translateY(21%) rotate(360deg)' }
    ], { duration: 750, easing: 'cubic-bezier(.3,.6,.45,1)' });
    capa.style.opacity = '1';
    const t = capa.querySelector('.tour');
    t.style.transformOrigin = '13% 60%';
    t.animate([{ transform: 'translateY(0) rotate(0deg)' }, { transform: 'translateY(-50%) rotate(-30deg)' }], { duration: 700, easing: 'ease-out', fill: 'forwards' });
    capa.querySelector('svg').animate([
      { transform: 'translateY(0) rotate(-8deg)' }, { transform: 'translateY(-14%) rotate(14deg)' }
    ], { duration: 900, delay: 700, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
  });
  at(s, tAtt, () => tor.classList.add('assis'));
  bulle(s, '¡Ay, ay, ay!', xAtt, tAtt + 150);
  at(s, tLeve, () => { tor.classList.remove('assis'); tor.classList.add('court'); });
}

/* 7. El tapeo : un camarero traverse avec son plateau de tapas, la bande le suit de bar en bar.
   Arrêt au milieu : ¡Marchando!, une vuelta, ¡Otra ronda!, et on repart vers le bar suivant. */
function sceneTapeo(s) {
  const { W, k } = s, wC = largeur(s, 'torero'), wD = largeur(s, 'bailaora'), v = Math.max(.12, W / 9000);
  const gD = wC * .62 + wD * .1, gT = gD + wD * .55 + wC * .3;
  const xC0 = horsG(wC), xStop = W * .62, xFin = horsD(s, wC) + gT;
  const tStop = (xStop - xC0) / v, tRepart = tStop + 2300, tFin = tRepart + (xFin - xStop) / v;
  s.total = tFin + 50;
  const pts = g => [[0, xC0 - g, 1], [tStop, xStop - g, 1], [tRepart, xStop - g, 1], [tFin, xFin - g, 1]];
  const cam = acteur(s, camareroSvg(), 'torero', pts(0), { z: 3, cls: 'marche' });
  const dz = acteur(s, bailaoraSvg(melange(ROBES)[0]), 'bailaora', pts(gD), { z: 2 });
  const tor = acteur(s, toreroSvg(), 'torero', pts(gT).map(p => [p[0], p[1], -1]), { z: 1, cls: 'marche' });
  at(s, tStop, () => { cam.classList.remove('marche'); tor.classList.remove('marche'); });
  bulle(s, '¡Marchando!', xStop, tStop + 100);
  at(s, tStop + 700, () => dz.querySelector('.tour').animate(TOUR, { duration: 900, easing: 'ease-in-out' }));
  bulle(s, '¡Otra ronda!', xStop - gT * .6, tStop + 1300);
  at(s, tRepart, () => { cam.classList.add('marche'); tor.classList.add('marche'); });
}

/* 8. La muleta : sur ordinateur, le curseur est un drapeau rouge que le taureau suit quand il passe.
   Dans l'onglet Fiesta, le jeu « Toréer » marche aussi au doigt. Chaque passe frôlée compte un ¡Olé!. */
const souris = { x: -1, y: -1, t: 0, dedans: false, appui: false, type: 'mouse' };
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { souris.x = e.clientX; souris.y = e.clientY; souris.t = performance.now(); souris.dedans = true; souris.type = 'mouse'; } }, { passive: true });
document.documentElement.addEventListener('mouseleave', () => { souris.dedans = false; });
const sourisActive = () => window.matchMedia('(pointer: fine)').matches && souris.dedans && performance.now() - souris.t < 10000;
function bulleLibre(texte, x, y, cls = '') {
  const b = document.createElement('span');
  b.className = 'bulle' + (cls ? ' ' + cls : '');
  b.textContent = texte;
  b.style.left = Math.max(70, Math.min(window.innerWidth - 70, x)) + 'px';
  b.style.top = Math.max(4, y) + 'px';
  $('#arene').appendChild(b);
  b.animate([
    { opacity: 0, transform: 'translateX(-50%) translateY(10px) scale(.6)' },
    { opacity: 1, transform: 'translateX(-50%) translateY(0) scale(1.12)', offset: .2 },
    { opacity: 1, transform: 'translateX(-50%) translateY(-4px) scale(1)', offset: .75 },
    { opacity: 0, transform: 'translateX(-50%) translateY(-16px) scale(1)' }
  ], { duration: cls.includes('grande') ? 2200 : 1400, easing: 'ease-out', fill: 'both' }).finished.then(() => b.remove(), () => b.remove());
}
function sceneMuleta(j) {
  const H = j ? Math.max(110, Math.min(180, window.innerHeight * .24)) : Math.max(90, Math.min(150, window.innerHeight * .2));
  const w = H * RATIO.toro, gen = paradeGen;
  const el = document.createElement('div');
  el.className = 'taureau-libre';
  el.style.width = w + 'px';
  el.style.height = H + 'px';
  el.innerHTML = `<div class="tour">${toroSvg()}</div>`;
  (j ? j.el : $('#arene')).appendChild(el);
  let x = souris.x >= 0 && souris.x < window.innerWidth / 2 ? window.innerWidth + w : -w;
  let y = souris.y >= 0 ? Math.max(H / 2, Math.min(window.innerHeight - H / 2, souris.y)) : window.innerHeight * .6;
  let vx = 0, vy = 0, face = x < 0 ? 1 : -1, passes = 0, proche = false, lasse = false, dernier = 0, prev = performance.now();
  const debut = prev;
  let dernierActif = prev;
  const actif = () => j ? (souris.appui || (souris.type === 'mouse' && souris.dedans && performance.now() - souris.t < 2500)) : sourisActive();
  return new Promise(fin => {
    const sortie = () => {
      el.remove();
      if (j) { j.resultat(passes, 'olés', 'oles', jeuMuleta); fin(); return; }
      const r = enregistrerScore('oles', passes);
      if (r.record && passes >= 2) bulleLibre(`¡Récord! ${passes} olés`, window.innerWidth / 2, window.innerHeight * .3, 'record');
      fin();
    };
    function pas(now) {
      if (gen !== paradeGen || (j && !j.actif)) { el.remove(); fin(); return; }
      const dt = Math.min(40, now - prev) / 1000;
      prev = now;
      if (actif()) dernierActif = now;
      const ennui = j ? (now - debut > 25000 || now - dernierActif > 4500) : (now - debut > 15000 || passes >= 8 || (!actif() && now - debut > 3000));
      if (!lasse && ennui) {
        lasse = true;
        bulleLibre(passes ? 'Bof…' : '¿Y la muleta?', x, y - H * .9);
      }
      const tx = lasse ? (face > 0 ? window.innerWidth + w * 2 : -w * 2) : (souris.x >= 0 ? souris.x : window.innerWidth / 2);
      const ty = lasse ? y : (souris.y >= 0 ? souris.y : y);
      const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1, acc = 1500;
      vx = (vx + dx / d * acc * dt) * .996;
      vy = (vy + dy / d * acc * dt * .8) * .996;
      const vmax = lasse ? 360 : 640, sp = Math.hypot(vx, vy);
      if (sp > vmax) { vx *= vmax / sp; vy *= vmax / sp; }
      x += vx * dt;
      y = Math.max(H * .4, Math.min(window.innerHeight - H * .4, y + vy * dt));
      if (Math.abs(vx) > 40) face = vx > 0 ? 1 : -1;
      /* Une passe : la tête du taureau frôle la muleta */
      const hx = x + face * w * .39, pres = !lasse && actif() && Math.hypot(hx - souris.x, y - souris.y) < H * .55;
      if (pres && !proche && now - dernier > 700) {
        passes++;
        dernier = now;
        if (j) j.score(passes);
        bulleLibre(passes > 1 ? `¡Olé! ×${passes}` : '¡Olé!', souris.x, souris.y - 80);
      }
      proche = pres;
      el.style.transform = `translate(${(x - w / 2).toFixed(1)}px, ${(y - H / 2).toFixed(1)}px) scaleX(${face})`;
      if (lasse && (x < -w * 1.5 || x > window.innerWidth + w * 1.5)) { sortie(); return; }
      requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  });
}

const SCENES = [[sceneBailaoras, 20], [scenePases, 18], [sceneTapeo, 16], [scenePoursuite, 12], [sceneChoc, 13], [sceneSalto, 13], [sceneCharge, 8]];
function tirerScene() {
  let r = Math.random() * SCENES.reduce((a, x) => a + x[1], 0);
  for (const [fn, p] of SCENES) { if ((r -= p) < 0) return fn; }
  return sceneBailaoras;
}
function planParade(delai) {
  clearTimeout(paradeT);
  if (!animOn()) return;
  paradeT = setTimeout(() => {
    if (document.hidden || dlg.open || jeuActif || !$('#parade').clientHeight) { planParade(1500); return; } /* on attend que l'écran soit libre */
    if (sourisActive() && Math.random() < .3) { sceneMuleta().then(() => planParade(5000 + Math.random() * 8000)); return; }
    const s = nouvelleScene();
    tirerScene()(s);
    planParade(s.total + 5000 + Math.random() * 8000);
  }, delai ?? 6000 + Math.random() * 8000);
}
function stopParade() { paradeGen++; clearTimeout(paradeT); $('#parade').innerHTML = ''; [...$('#arene').children].forEach(c => { if (!c.classList.contains('jeu')) c.remove(); }); }
const majCurseur = () => document.documentElement.classList.toggle('muleta', animOn());
/* Lance une scène tout de suite (récompenses, fiesta, secousse), en plus de la parade habituelle */
function lanceScene(fn, opts) {
  if (!animOn() || !$('#parade').clientHeight) return null;
  const s = nouvelleScene();
  fn(s, opts);
  return s;
}

/* ================= Jeux ================= */
const UNITES = { oles: 'olés', tapas: 'points', compas: 'points' };
const NOMS_JEUX = { oles: 'Toréer', tapas: 'Attrape la tapa', compas: 'Castañuelas' };
const scoresPropres = o => Object.fromEntries(Object.entries(o && typeof o === 'object' ? o : {})
  .filter(([, v]) => Number.isFinite(+v) && +v > 0).map(([k, v]) => [k, Math.round(+v)]));
function normJeux(j) {
  j = j && typeof j === 'object' ? j : {};
  const c = j.cache && typeof j.cache === 'object' && typeof j.cache.cible === 'string' ? j.cache : null;
  return {
    oles: scoresPropres(j.oles), tapas: scoresPropres(j.tapas), compas: scoresPropres(j.compas), trouvailles: scoresPropres(j.trouvailles),
    cache: c ? { cible: c.cible, depuis: String(c.depuis || ''), dernier: c.dernier && typeof c.dernier === 'object' ? { par: String(c.dernier.par || ''), le: String(c.dernier.le || '') } : null } : null
  };
}
function meilleurScore(jeu) {
  const moi = me();
  const local = Number(store.get('best-' + jeu)) || 0;
  const partage = moi && S.data ? (S.data.jeux[jeu][moi.id] || 0) : 0;
  return Math.max(local, partage);
}
/* Garde le record sur l'appareil, et au classement du groupe si on a la clé d'édition et un prénom */
function enregistrerScore(jeu, score) {
  const avant = meilleurScore(jeu);
  if (!(score > 0)) return { record: false, avant };
  if (score > (Number(store.get('best-' + jeu)) || 0)) store.set('best-' + jeu, String(score));
  const moi = me();
  if (moi && canEdit() && S.data && score > (S.data.jeux[jeu][moi.id] || 0)) {
    commit(`bat son record à « ${NOMS_JEUX[jeu]} » : ${score} ${UNITES[jeu]}`, d => { if (score > (d.jeux[jeu][moi.id] || 0)) d.jeux[jeu][moi.id] = score; });
  }
  return { record: score > avant, avant };
}

/* Son : castagnettes et palmas synthétisées (aucun fichier à charger) */
let audioCtx = null, bruitBuf = null;
function audio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!bruitBuf) {
      bruitBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * .15), audioCtx.sampleRate);
      const ch = bruitBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    return audioCtx;
  } catch { return null; }
}
function son(type) {
  const ctx = audioCtx && audioCtx.state === 'running' ? audioCtx : null;
  if (!ctx) return;
  const t = ctx.currentTime;
  const reglages = { clac: [2900, 5, .9, .055], palma: [1250, 1.1, .32, .09], acc: [1100, 1, .55, .12] }[type];
  const src = ctx.createBufferSource();
  src.buffer = bruitBuf;
  const f = ctx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = reglages[0];
  f.Q.value = reglages[1];
  const g = ctx.createGain();
  g.gain.setValueAtTime(reglages[2], t);
  g.gain.exponentialRampToValueAtTime(.001, t + reglages[3]);
  src.connect(f).connect(g).connect(ctx.destination);
  src.start(t);
  src.stop(t + .15);
  if (type === 'clac') {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.value = 1900;
    og.gain.setValueAtTime(.22, t);
    og.gain.exponentialRampToValueAtTime(.001, t + .03);
    o.connect(og).connect(ctx.destination);
    o.start(t);
    o.stop(t + .04);
  }
}

/* Cadre commun des jeux : calque plein écran, score, temps, bouton pour quitter, écran de fin */
let jeuActif = null;
function ouvrirJeu(titre, aide, { clair = false } = {}) {
  if (jeuActif) jeuActif.fermer();
  const el = document.createElement('div');
  el.className = 'jeu' + (clair ? ' jeu--clair' : '');
  el.innerHTML = `<div class="jeu-hud"><b>${esc(titre)}</b><span class="jeu-score">0</span><span class="jeu-temps"></span><button type="button" class="jeu-x" aria-label="Quitter le jeu">${icon('x')}</button></div><p class="jeu-aide">${esc(aide)}</p>`;
  $('#arene').appendChild(el);
  const nettoyages = [];
  const touche = e => { if (e.key === 'Escape') j.fermer(); };
  const j = {
    el, actif: true,
    score: v => { el.querySelector('.jeu-score').textContent = v; },
    temps: ms => { el.querySelector('.jeu-temps').textContent = ms > 0 ? Math.ceil(ms / 1000) + ' s' : ''; },
    nettoyer: fn => nettoyages.push(fn),
    fermer() {
      if (!j.actif) return;
      j.actif = false;
      nettoyages.forEach(fn => { try { fn(); } catch { /* rien */ } });
      removeEventListener('keydown', touche);
      el.remove();
      if (jeuActif === j) jeuActif = null;
      document.documentElement.classList.remove('en-jeu');
    },
    resultat(score, unite, jeu, rejouer) {
      if (!j.actif) return;
      const r = enregistrerScore(jeu, score);
      const moi = me();
      const note = !moi ? 'Choisis ton prénom dans Réglages pour entrer au classement.'
        : !canEdit() ? 'Score gardé sur cet appareil : il faut le lien d’édition pour le classement du groupe.' : '';
      const meilleur = Math.max(r.avant, score);
      const p = document.createElement('div');
      p.className = 'jeu-fin';
      p.innerHTML = `<p class="jeu-fin-titre">${score > 0 ? (r.record ? '¡Récord!' : '¡Olé!') : '¡Ay!'}</p>
        <p class="jeu-fin-score">${score} ${esc(unite)}</p>
        ${meilleur ? `<p class="muet">Ton meilleur score : ${meilleur} ${esc(unite)}</p>` : ''}
        ${note ? `<p class="aide">${esc(note)}</p>` : ''}
        <div class="boutons"><button type="button" class="btn" data-fin="fermer">Fermer</button><button type="button" class="btn btn--primary" data-fin="rejouer">Rejouer</button></div>`;
      el.appendChild(p);
      p.addEventListener('pointerdown', e => e.stopPropagation());
      p.addEventListener('click', e => {
        const b = e.target.closest('[data-fin]');
        if (!b) return;
        j.fermer();
        if (b.dataset.fin === 'rejouer') rejouer();
      });
    }
  };
  const x = el.querySelector('.jeu-x');
  x.addEventListener('pointerdown', e => e.stopPropagation());
  x.addEventListener('click', () => j.fermer());
  addEventListener('keydown', touche);
  document.documentElement.classList.add('en-jeu');
  jeuActif = j;
  return j;
}
const acteurLibre = (html, w, h, cls = '') => {
  const el = document.createElement('div');
  el.className = 'acteur-libre' + (cls ? ' ' + cls : '');
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  el.innerHTML = `<div class="tour">${html}</div>`;
  return el;
};

/* --- Jeu 1 : Toréer (muleta au doigt ou à la souris) --- */
function capaMiniSvg() {
  return `<svg viewBox="-4 82 66 88" xmlns="http://www.w3.org/2000/svg"><g class="p-capa">
    <path d="M46 86 C33 84 15 86 1 92 C-3 118 -1 142 5 164 Q17 157 27 166 Q38 157 49 161 C53 136 51 110 46 86 Z" fill="#B3202E"/>
    <path d="M17 92 C14 118 15 140 17 160 M33 90 C32 116 34 140 37 160" fill="none" stroke="#7D1520" stroke-width="1.6" opacity=".6"/>
    <path d="M39 87 L59 85" stroke="#6B4A2A" stroke-width="3" stroke-linecap="round"/></g></svg>`;
}
function jeuMuleta() {
  if (!S.data) return;
  const j = ouvrirJeu('Toréer', 'Garde le doigt sur l’écran (ou bouge la souris) : le taureau suit ta muleta. Chaque passe frôlée = un ¡Olé!', { clair: true });
  const mul = document.createElement('div');
  mul.className = 'muleta-doigt';
  mul.innerHTML = capaMiniSvg();
  mul.hidden = true;
  j.el.appendChild(mul);
  const maj = e => {
    souris.x = e.clientX; souris.y = e.clientY; souris.t = performance.now(); souris.dedans = true; souris.type = e.pointerType;
    if (e.pointerType !== 'mouse') { mul.hidden = !souris.appui; mul.style.transform = `translate(${e.clientX - 34}px, ${e.clientY - 96}px)`; }
  };
  j.el.addEventListener('pointerdown', e => { souris.appui = true; maj(e); });
  j.el.addEventListener('pointermove', maj);
  const leve = () => { souris.appui = false; mul.hidden = true; };
  j.el.addEventListener('pointerup', leve);
  j.el.addEventListener('pointercancel', leve);
  j.nettoyer(leve);
  sceneMuleta(j);
}

/* --- Jeu 2 : Attrape la tapa --- */
const TAPAS = {
  jamon: { pts: 3, taille: 60, g: 1.15, svg: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="28" rx="27" ry="9" fill="#FBF7F0" stroke="#D8D2C8" stroke-width="1.5"/><path d="M8 26 Q14 12 22 22 Q28 10 36 22 Q44 11 52 25 Q44 31 30 30 Q16 31 8 26 Z" fill="#C8506A"/><path d="M13 22 Q17 18 20 22 M26 19 Q30 15 33 20 M40 20 Q44 17 47 22" fill="none" stroke="#FBF7F0" stroke-width="1.6"/></svg>' },
  pescaito: { pts: 2, taille: 52, g: 1, svg: '<svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg"><ellipse cx="14" cy="15" rx="4.5" ry="10" fill="#D9A03A" transform="rotate(-22 14 15)"/><ellipse cx="20" cy="11" rx="4.5" ry="11" fill="#E2B04A"/><ellipse cx="26" cy="15" rx="4.5" ry="10" fill="#C98A1B" transform="rotate(22 26 15)"/><path d="M7 19 L20 48 L33 19 Z" fill="#F2E6D0" stroke="#D8C9AE" stroke-width="1.5"/><path d="M11 25 H29" stroke="#B3202E" stroke-width="2"/></svg>' },
  aceituna: { pts: 1, taille: 36, g: .9, svg: '<svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><ellipse cx="15" cy="15" rx="10" ry="13" fill="#6B8E23" stroke="#4E6B17" stroke-width="1.5" transform="rotate(-25 15 15)"/><circle cx="18" cy="8" r="3.4" fill="#B3202E"/><ellipse cx="11" cy="16" rx="2.4" ry="5" fill="#9CBF4A" opacity=".6" transform="rotate(-25 11 16)"/></svg>' }
};
function jeuTapas() {
  if (!S.data) return;
  audio();
  const j = ouvrirJeu('Attrape la tapa', 'Le camarero va trébucher : touche les tapas avant qu’elles tombent par terre. Jamón 3 pts, pescaíto 2, aceituna 1.');
  const W = window.innerWidth, Hh = window.innerHeight, sol = Hh - 34, duree = 30000;
  const hC = Math.max(120, Math.min(190, Hh * .22)), wC = hC * RATIO.torero, yC = Math.max(64, Hh * .14);
  const grav = 900 * Math.max(.7, Hh / 800);
  j.el.insertAdjacentHTML('beforeend', '<div class="jeu-sol"></div>');
  let score = 0, items = [], cam = null, fini = false;
  const debut = performance.now();
  let prochain = debut + 700, prev = debut, finA = 0;
  function nouveauCamarero(now) {
    const dir = Math.random() < .5 ? 1 : -1;
    const el = acteurLibre(camareroSvg(), wC, hC, 'marche');
    j.el.appendChild(el);
    const avance = (now - debut) / duree;
    cam = { el, dir, x: dir > 0 ? -wC : W + wC, xTrip: W * (.22 + Math.random() * .56), v: Math.max(.16, W / 5000) * (1 + avance * .7), etat: 'marche' };
  }
  function trebuche(now) {
    cam.etat = 'chute';
    cam.el.classList.add('sans-tapas');
    cam.el.classList.remove('marche');
    cam.el.querySelector('.tour').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(26deg)', offset: .35 }, { transform: 'rotate(-6deg)', offset: .7 }, { transform: 'rotate(0)' }], { duration: 900, easing: 'ease-out' });
    bulleLibre('¡Ay!', cam.x, yC - 34);
    const tx = cam.x + cam.dir * (30 / 200) * wC, ty = yC + (22 / 210) * hC;
    const n = 3 + Math.floor(Math.random() * 3) + Math.floor((now - debut) / 12000);
    for (let i = 0; i < n; i++) {
      const r = Math.random(), type = r < .25 ? 'jamon' : r < .6 ? 'pescaito' : 'aceituna', T = TAPAS[type];
      const el = document.createElement('div');
      el.className = 'tapa';
      el.style.width = T.taille + 'px';
      el.innerHTML = T.svg;
      j.el.appendChild(el);
      items.push({ el, type, x: tx, y: ty, vx: cam.dir * (60 + Math.random() * 200) + (Math.random() - .5) * 160, vy: -(240 + Math.random() * 220), rot: 0, vr: (Math.random() - .5) * 600 });
    }
    const c = cam;
    setTimeout(() => { if (c === cam) { c.etat = 'repart'; c.el.classList.add('marche'); } }, 900);
  }
  j.el.addEventListener('pointerdown', e => {
    let best = null, bd = Infinity;
    for (const it of items) {
      if (it.mort) continue;
      const d = Math.hypot(e.clientX - it.x, e.clientY - it.y);
      if (d < TAPAS[it.type].taille * .75 + 16 && d < bd) { best = it; bd = d; }
    }
    if (!best) return;
    best.mort = true;
    score += TAPAS[best.type].pts;
    j.score(score);
    son('clac');
    bulleLibre('+' + TAPAS[best.type].pts, best.x, best.y - 50, 'plus');
    best.el.animate([{ transform: best.el.style.transform + ' scale(1)', opacity: 1 }, { transform: best.el.style.transform + ' scale(1.6)', opacity: 0 }], { duration: 260, easing: 'ease-out' })
      .finished.then(() => best.el.remove(), () => best.el.remove());
  });
  function pas(now) {
    if (!j.actif) return;
    const dt = Math.min(40, now - prev) / 1000;
    prev = now;
    const reste = duree - (now - debut);
    j.temps(reste);
    if (reste <= 0 && !fini) { fini = true; finA = now; }
    if (!cam && !fini && now >= prochain) nouveauCamarero(now);
    if (cam) {
      if (cam.etat !== 'chute') cam.x += cam.dir * cam.v * dt * 1000;
      if (cam.etat === 'marche' && (cam.dir > 0 ? cam.x >= cam.xTrip : cam.x <= cam.xTrip)) trebuche(now);
      cam.el.style.transform = `translate(${(cam.x - wC / 2).toFixed(1)}px, ${yC.toFixed(1)}px) scaleX(${cam.dir})`;
      if (cam.x < -wC * 1.2 || cam.x > W + wC * 1.2) { cam.el.remove(); cam = null; prochain = now + 400 + Math.random() * 700; }
    }
    for (const it of items) {
      if (it.mort) continue;
      it.vy += grav * TAPAS[it.type].g * dt;
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.rot += it.vr * dt;
      if (it.x < 20 || it.x > W - 20) { it.vx *= -.6; it.x = Math.max(20, Math.min(W - 20, it.x)); }
      const T = TAPAS[it.type];
      if (it.y >= sol - T.taille * .3) {
        it.mort = true;
        it.y = sol - T.taille * .3;
        if (it.type === 'jamon') bulleLibre('¡Plaf!', it.x, sol - 70, 'plaf');
        it.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, delay: 300, fill: 'forwards' }).finished.then(() => it.el.remove(), () => it.el.remove());
      }
      it.el.style.transform = `translate(${(it.x - T.taille / 2).toFixed(1)}px, ${(it.y - T.taille / 2).toFixed(1)}px) rotate(${it.rot.toFixed(0)}deg)`;
    }
    items = items.filter(it => !it.mort || it.el.isConnected);
    if (fini && !cam && (items.every(it => it.mort) || now - finA > 3000)) { j.resultat(score, 'points', 'tapas', jeuTapas); return; }
    if (fini && cam && cam.etat === 'marche') { cam.etat = 'repart'; }
    requestAnimationFrame(pas);
  }
  requestAnimationFrame(pas);
}

/* --- Jeu 3 : Castañuelas (tenir le compás) --- */
function jeuCompas() {
  if (!S.data) return;
  audio();
  const j = ouvrirJeu('Castañuelas', 'Tape sur l’écran en même temps que les palmas. Tiens le compás : la bailaora danse de plus en plus vite.');
  const W = window.innerWidth, Hh = window.innerHeight;
  const hD = Math.min(Hh * .46, 340), wD = hD * RATIO.bailaora;
  j.el.insertAdjacentHTML('beforeend', '<div class="compas-anneau"></div><p class="compas-retour"></p>');
  const dz = acteurLibre(bailaoraSvg(melange(ROBES)[0]), wD, hD, 'compas-danseuse');
  dz.style.transform = `translate(${(W / 2 - wD / 2).toFixed(1)}px, ${(Hh * .56 - hD / 2).toFixed(1)}px)`;
  j.el.appendChild(dz);
  const anneau = j.el.querySelector('.compas-anneau'), retour = j.el.querySelector('.compas-retour');
  const parts = { jupe: [dz.querySelector('.p-jupe'), .84], danse: [dz.querySelector('.p-danse'), .42], a: [dz.querySelector('.p-bras-a'), 1.7], b: [dz.querySelector('.p-bras-b'), 1.7] };
  const debut = performance.now(), duree = 30000;
  let bpm = 88, beatMs = 60000 / bpm, prochainBeat = debut + 900, dernierBeat = -1e9, indexBeat = 0, combo = 0, score = 0;
  const notes = new Set();
  const vitesse = () => {
    const f = 1 + Math.min(combo, 24) * .07;
    for (const [el, base] of Object.values(parts)) if (el) el.style.animationDuration = (base / f).toFixed(3) + 's';
  };
  const montre = (txt, cls) => {
    retour.textContent = txt;
    retour.className = 'compas-retour ' + cls;
    retour.animate([{ transform: 'translateX(-50%) scale(.7)', opacity: 0 }, { transform: 'translateX(-50%) scale(1.1)', opacity: 1, offset: .3 }, { transform: 'translateX(-50%) scale(1)', opacity: 0 }], { duration: 650, easing: 'ease-out' });
  };
  j.el.addEventListener('pointerdown', () => {
    const now = performance.now();
    son('clac');
    if (now - debut > duree) return;
    const dPrev = now - dernierBeat, dNext = prochainBeat - now;
    const proche = dPrev <= dNext ? { i: indexBeat, d: dPrev } : { i: indexBeat + 1, d: dNext };
    if (proche.d <= 120 && !notes.has(proche.i)) {
      notes.add(proche.i);
      combo++;
      const parfait = proche.d <= 55;
      score += parfait ? 2 : 1;
      j.score(score);
      montre(parfait ? '¡Olé!' : '¡Bien!', 'ok');
      if (combo % 8 === 0) {
        dz.querySelector('.tour').animate(TOUR, { duration: 700, easing: 'ease-in-out' });
        bpm = Math.min(152, bpm + 8);
        beatMs = 60000 / bpm;
      }
    } else {
      combo = 0;
      montre('¡Uy!', 'ko');
      dz.querySelector('.tour').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-9deg) translateX(-4%)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(0)' }], { duration: 500, easing: 'ease-out' });
      bpm = Math.max(84, bpm - 4);
      beatMs = 60000 / bpm;
    }
    vitesse();
  });
  function pas(now) {
    if (!j.actif) return;
    const reste = duree - (now - debut);
    j.temps(reste);
    if (reste <= 0) { j.resultat(score, 'points', 'compas', jeuCompas); return; }
    while (now >= prochainBeat) {
      indexBeat++;
      dernierBeat = prochainBeat;
      const fort = indexBeat % 4 === 1;
      son(fort ? 'acc' : 'palma');
      anneau.classList.toggle('fort', fort);
      anneau.animate([{ transform: 'translateX(-50%) scale(1.35)', opacity: 1 }, { transform: 'translateX(-50%) scale(1)', opacity: .55 }], { duration: Math.min(380, beatMs * .8), easing: 'ease-out' });
      prochainBeat += beatMs;
    }
    requestAnimationFrame(pas);
  }
  requestAnimationFrame(pas);
}

/* ================= Taureau caché ================= */
/* Un petit taureau se cache derrière une carte (un jour, un vol, un logement, une activité).
   Le premier qui le touche gagne un ¡Olé! affiché à tout le groupe ; il se recache ailleurs 4 h plus tard. */
const cibles = d => [...tripDays(d).map(x => 'jour-' + x), ...d.flights.map(f => f.id), ...d.stays.map(s => s.id), ...d.activities.map(a => a.id)];
const auHasard = l => l[Math.floor(Math.random() * l.length)];
function miniToroSvg() {
  return `<svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg">
    <path d="M17 24 C9 20 5 11 8 3" fill="none" stroke="#F2E6D0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M43 24 C51 20 55 11 52 3" fill="none" stroke="#F2E6D0" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="11" cy="27" rx="7" ry="3.6" fill="#1E1515" transform="rotate(-20 11 27)"/>
    <ellipse cx="49" cy="27" rx="7" ry="3.6" fill="#1E1515" transform="rotate(20 49 27)"/>
    <path d="M14 46 C12 30 18 18 30 18 C42 18 48 30 46 46 Z" fill="#1E1515"/>
    <circle cx="24" cy="30" r="4.2" fill="#FBF7F0"/><circle cx="36" cy="30" r="4.2" fill="#FBF7F0"/>
    <circle cx="25.5" cy="30.5" r="2.1" fill="#1E1515"/><circle cx="37.5" cy="30.5" r="2.1" fill="#1E1515"/>
    <ellipse cx="30" cy="41" rx="9" ry="5" fill="#3A2A28"/>
  </svg>`;
}
function placerTaureauCache() {
  const d = S.data;
  if (!d) return;
  const c = d.jeux.cache;
  if (!c) {
    if (canEdit() && !S.cacheDemande && cibles(d).length) {
      S.cacheDemande = true;
      setTimeout(() => commit('cache un taureau dans le site', dd => {
        if (!dd.jeux.cache) dd.jeux.cache = { cible: auHasard(cibles(dd)), depuis: new Date().toISOString(), dernier: null };
      }), 0);
    }
    return;
  }
  if (c.depuis && new Date(c.depuis) > new Date()) return;
  const l = cibles(d);
  const cible = l.includes(c.cible) ? c.cible : l[0];
  if (!cible) return;
  const hote = $(`#main [data-cache="${CSS.escape(cible)}"]`);
  if (!hote) return;
  const ligne = hote.tagName === 'LI';
  hote.classList.add('cache-ici');
  hote.insertAdjacentHTML('beforeend', `<button type="button" class="taureau-cache${ligne ? ' taureau-cache--ligne' : ''}" data-act="taureau-cache" aria-label="Un taureau se cache ici !">${miniToroSvg()}</button>`);
}
function attraperTaureau(btn) {
  const d = S.data, c = d && d.jeux.cache;
  if (!c) return;
  const r = btn.getBoundingClientRect();
  bulleLibre('¡Olé!', r.left + r.width / 2, r.top - 60, 'grande');
  son('clac');
  btn.remove();
  pluieEventails(10);
  const moi = me();
  if (!canEdit()) { toast('¡Olé! Pour inscrire ton nom, il faut le lien d’édition.'); return; }
  if (!moi) { toast('¡Olé! Choisis ton prénom dans Réglages pour que le groupe le sache.'); return; }
  const cibleTrouvee = c.cible;
  commit('a trouvé le taureau caché', dd => {
    const cc = dd.jeux.cache;
    if (!cc || cc.cible !== cibleTrouvee || (cc.depuis && new Date(cc.depuis) > new Date())) return dd; /* quelqu’un l’a eu avant */
    dd.jeux.trouvailles[moi.id] = (dd.jeux.trouvailles[moi.id] || 0) + 1;
    const autres = cibles(dd).filter(x => x !== cibleTrouvee);
    dd.jeux.cache = { cible: autres.length ? auHasard(autres) : cibleTrouvee, depuis: new Date(Date.now() + 4 * 3600000).toISOString(), dernier: { par: moi.id, le: new Date().toISOString() } };
    return dd;
  });
}
function bandeauTaureau(d) {
  const c = d.jeux.cache;
  if (!c || !c.dernier || !c.dernier.par) return '';
  const le = new Date(c.dernier.le);
  if (isNaN(le) || Date.now() - le > 2 * 86400000) return '';
  const dans = c.depuis ? Math.ceil((new Date(c.depuis) - Date.now()) / 3600000) : 0;
  return `<p class="bandeau bandeau--ole"><b>¡Olé!</b> ${esc(tName(d, c.dernier.par) || 'Quelqu’un')} a trouvé le taureau caché. ${dans > 0 ? `Il revient se cacher dans ${dans} h.` : 'Il s’est déjà recaché ailleurs…'}</p>`;
}

/* ================= Fiesta, récompenses, secousse, mot magique ================= */
function eventailSvg(c) {
  let cotes = '';
  for (let a = 215; a <= 325; a += 22) cotes += `<path d="M30 36 L${(30 + 31 * Math.cos(a * Math.PI / 180)).toFixed(1)} ${(36 + 31 * Math.sin(a * Math.PI / 180)).toFixed(1)}" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg"><path d="M30 36 L0 25 A32 32 0 0 1 60 25 Z" fill="${c.robe}"/>${cotes}
    <circle cx="16" cy="18" r="2.2" fill="${c.pois}"/><circle cx="30" cy="11" r="2.2" fill="${c.pois}"/><circle cx="44" cy="18" r="2.2" fill="${c.pois}"/><circle cx="23" cy="25" r="2" fill="${c.pois}"/><circle cx="37" cy="25" r="2" fill="${c.pois}"/>
    <rect x="27.5" y="34" width="5" height="9" rx="2" fill="#6B4A2A"/></svg>`;
}
function pluieEventails(n) {
  if (!animOn()) return;
  const W = window.innerWidth, H = window.innerHeight;
  for (let i = 0; i < n; i++) {
    const e = document.createElement('span');
    e.className = 'eventail';
    const taille = 36 + Math.random() * 36;
    e.style.width = taille + 'px';
    e.style.left = (Math.random() * (W - taille)) + 'px';
    e.innerHTML = eventailSvg(auHasard(ROBES));
    $('#arene').appendChild(e);
    const s = 20 + Math.random() * 50, r0 = Math.random() * 360, sens = Math.random() < .5 ? 1 : -1;
    e.animate([
      { transform: `translate(0,-90px) rotate(${r0}deg)` },
      { transform: `translate(${s}px,${H * .33}px) rotate(${r0 + 140 * sens}deg)` },
      { transform: `translate(${-s}px,${H * .66}px) rotate(${r0 + 260 * sens}deg)` },
      { transform: `translate(${s * .5}px,${H + 90}px) rotate(${r0 + 380 * sens}deg)` }
    ], { duration: 3000 + Math.random() * 2200, delay: Math.random() * 1800, easing: 'linear', fill: 'both' }).finished.then(() => e.remove(), () => e.remove());
  }
}
/* Toute la troupe défile : camarero en tête, trois bailaoras, le torero ferme la marche */
function sceneFiesta(s) {
  const { W } = s, wC = largeur(s, 'torero'), wD = largeur(s, 'bailaora'), v = Math.max(.13, W / 8000);
  const membres = [{ t: 'cam', w: wC }, ...melange(ROBES).slice(0, 3).map(robe => ({ t: 'dz', w: wD, robe })), { t: 'tor', w: wC }];
  let off = 0;
  membres.forEach(m => { m.off = off; off += m.w * .72; });
  const x0 = horsG(wC), dist = W + wC + 60 + off;
  s.total = dist / v;
  membres.forEach((m, i) => {
    const a = x0 - m.off, f = m.t === 'tor' ? -1 : 1;
    const html = m.t === 'cam' ? camareroSvg() : m.t === 'tor' ? toreroSvg() : bailaoraSvg(m.robe);
    const el = acteur(s, html, m.t === 'dz' ? 'bailaora' : 'torero', [[0, a, f], [s.total, a + dist, f]], { z: 9 - i, cls: m.t === 'dz' ? '' : 'marche' });
    if (m.t === 'dz') at(s, (W / 2 - a) / v - 400, () => el.querySelector('.tour').animate(TOUR, { duration: 900, easing: 'ease-in-out' }));
  });
}
let fiestaT = 0;
function fiesta(texte) {
  if (Date.now() - fiestaT < 6000) return;
  fiestaT = Date.now();
  if (!animOn()) { toast('¡Olé! Active les animations dans Réglages pour la fiesta.'); return; }
  audio();
  [0, 140, 280, 560, 700].forEach(t => setTimeout(() => son('clac'), t));
  pluieEventails(28);
  lanceScene(sceneFiesta);
  bulleLibre(texte, window.innerWidth / 2, window.innerHeight * .26, 'grande');
}
/* Récompenses : un point de « Reste à caler » réglé = tour d'honneur ; tout calé = grande parade.
   Et quand quelqu'un trouve le taureau caché, tout le groupe le voit. */
function recompenses() {
  const d = S.data;
  if (!d) return;
  const nb = openPoints(d).length;
  const dern = d.jeux.cache && d.jeux.cache.dernier ? d.jeux.cache.dernier.le : '';
  if (S.nbReste !== undefined && animOn()) {
    if (nb === 0 && S.nbReste > 0) {
      pluieEventails(34);
      lanceScene(sceneFiesta);
      bulleLibre('¡Todo listo!', window.innerWidth / 2, window.innerHeight * .26, 'grande');
    } else if (nb < S.nbReste) {
      lanceScene(sceneBailaoras, { n: 1, texte: '¡Bien hecho!' });
    }
    if (dern && dern !== S.dernierTrouve) {
      const qui = tName(d, d.jeux.cache.dernier.par);
      if (qui) setTimeout(() => bulleLibre(`¡Olé, ${qui}!`, window.innerWidth / 2, window.innerHeight * .3, 'grande'), 600);
    }
  }
  S.nbReste = nb;
  S.dernierTrouve = dern;
}
/* Secouer le téléphone : le taureau charge à travers l'écran */
function sceneTaureauFou(s) {
  const wB = largeur(s, 'toro'), v = vitTaureau(s) * 1.5, a = horsG(wB), b = horsD(s, wB);
  s.total = (b - a) / v;
  acteur(s, toroSvg(), 'toro', [[0, a, 1], [s.total, b, 1]], { z: 8 });
  bulle(s, '¡Toro!', s.W * .5, s.total * .3);
}
let pics = [], derniereSecousse = 0;
addEventListener('devicemotion', e => {
  const a = e.acceleration && e.acceleration.x !== null ? e.acceleration : null;
  const g = e.accelerationIncludingGravity;
  const m = a ? Math.hypot(a.x || 0, a.y || 0, a.z || 0) : g ? Math.abs(Math.hypot(g.x || 0, g.y || 0, g.z || 0) - 9.81) : 0;
  if (m < 14) return;
  const now = Date.now();
  pics = pics.filter(t => now - t < 800);
  pics.push(now);
  if (pics.length >= 3 && now - derniereSecousse > 4000 && animOn() && !jeuActif) {
    derniereSecousse = now;
    pics = [];
    tremble();
    lanceScene(sceneTaureauFou);
  }
});
const secousseIOS = () => typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
async function activerSecousse() {
  try {
    const r = await DeviceMotionEvent.requestPermission();
    if (r === 'granted') { store.set('secousse', '1'); toast('Secoue ton téléphone… ¡Toro!'); renderMain(); }
    else toast('Mouvements refusés : réactive-les dans les réglages de Safari.', 'err');
  } catch { toast('Impossible d’activer les mouvements sur ce téléphone.', 'err'); }
}
/* Mot magique : taper « olé » (hors des champs de saisie), ou toucher trois fois le titre */
let tampon = '', tapsTitre = [];
document.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (!e.key || e.key.length !== 1) return;

/* ---------- Onglet Fiesta ---------- */
function classement(d, jeu) {
  return d.travelers.map((t, i) => ({ t, i, v: d.jeux[jeu][t.id] || 0 })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
}
function podiumHtml(l, unite) {
  if (!l.length) return '<p class="muet">Personne n’a encore toréé. À toi de jouer !</p>';
  const ordre = [[l[1], 2], [l[0], 1], [l[2], 3]];
  return `<div class="podium">${ordre.map(([x, rang]) => x
    ? `<div class="podium-place p${rang}">${avatarHtml(x.t, x.i, 'ini--grand')}<b>${esc(x.t.name)}</b><span>${x.v} ${unite}</span><div class="podium-bloc">${rang}</div></div>`
    : '<div class="podium-place p-vide"></div>').join('')}</div>`;
}
function viewFiesta(d) {
  const carte = (jeu, titre, texte, act) => {
    const l = classement(d, jeu), mien = meilleurScore(jeu);
    return `<article class="jeu-carte">
      <h3>${titre}</h3><p>${texte}</p>
      ${l.length ? `<ol class="mini-classement">${l.slice(0, 3).map(x => `<li>${avatarHtml(x.t, x.i, 'ini--petit')}<span>${esc(x.t.name)}</span><b>${x.v}</b></li>`).join('')}</ol>` : '<p class="muet">Pas encore de score.</p>'}
      ${mien ? `<p class="aide">Ton meilleur : ${mien} ${UNITES[jeu]}</p>` : ''}
      <button type="button" class="btn btn--primary" data-act="${act}">Jouer</button>
    </article>`;
  };
  const c = d.jeux.cache;
  const dans = c && c.depuis ? Math.ceil((new Date(c.depuis) - Date.now()) / 3600000) : 0;
  const etatCache = !c ? 'Le taureau cherche encore une cachette…'
    : dans > 0 ? `Trouvé${c.dernier ? ' par ' + esc(tName(d, c.dernier.par) || 'quelqu’un') : ''}. Il revient se cacher dans ${dans} h.`
    : 'Un petit taureau se cache derrière une carte du site : un jour du programme, un vol, un logement ou une activité. Le premier qui le touche gagne un ¡Olé! que tout le groupe verra.';
  const trouv = classement(d, 'trouvailles');
  const secousse = secousseIOS() && store.get('secousse') !== '1'
    ? '<button type="button" class="btn btn--petit" data-act="secousse-ios">Activer sur cet iPhone</button>' : '';
  return `<div class="tete"><h2>Fiesta</h2><button type="button" class="btn" data-act="fiesta">¡Fiesta!</button></div>
    <p class="intro-fiesta">Des petits jeux pour patienter jusqu’au départ. Les records entrent au classement du groupe avec ton prénom (Réglages → Toi).</p>
    <section class="section"><h2>Mejor torero</h2><p class="intro">Record de passes avec la muleta.</p>${podiumHtml(classement(d, 'oles'), 'olés')}</section>
    <section class="section"><h2>Les jeux</h2><div class="jeux-grille">
      ${carte('oles', 'Toréer', 'Garde le doigt sur l’écran (ou la souris) : le taureau suit ta muleta. Chaque passe frôlée vaut un ¡Olé!', 'jeu-muleta')}
      ${carte('tapas', 'Attrape la tapa', 'Le camarero trébuche et les tapas volent. Touche-les avant qu’elles tombent : jamón 3 pts, pescaíto 2, aceituna 1.', 'jeu-tapas')}
      ${carte('compas', 'Castañuelas', 'Tape en rythme avec les palmas. Si tu tiens le compás, la bailaora danse de plus en plus vite.', 'jeu-compas')}
    </div></section>
    <section class="section"><h2>Le taureau caché</h2><p class="intro">${etatCache}</p>
      ${trouv.length ? `<ol class="mini-classement">${trouv.map(x => `<li>${avatarHtml(x.t, x.i, 'ini--petit')}<span>${esc(x.t.name)}</span><b>${x.v} fois</b></li>`).join('')}</ol>` : ''}</section>
    <section class="section"><h2>Secrets</h2><ul class="secrets">
      <li><b>Secoue ton téléphone</b> : le taureau charge à travers l’écran. ${secousse}</li>
      <li><b>Tape « olé »</b> au clavier, ou touche trois fois le titre en haut : fiesta !</li>
      <li><b>Sur ordinateur</b>, ta souris est une muleta : quand le taureau passe, attire-le.</li>
      <li><b>Coche ce qui reste à caler</b> : une bailaora vient faire un tour d’honneur. Quand tout est calé, grande parade.</li>
    </ul></section>`;
}

/* ================= Entrée dans les arènes ================= */
/* Au chargement : la façade des arènes sur fond noir, les portes s'ouvrent, on passe l'entrée
   et le site apparaît derrière. Toucher l'écran pour passer. */
function arenaSvg(nom) {
  const cal = '#F3ECDF', ocre = '#D9A03A', ocreF = '#B07A22', brique = '#9C3B2A', rouge = '#B3202E';
  let arcs = '';
  for (let i = 0; i < 10; i++) {
    const x = 8 + i * 39.4;
    arcs += `<path d="M${x} 88 V71 A12 12 0 0 1 ${x + 24} 71 V88 Z" fill="#2A1B17" stroke="${ocre}" stroke-width="2"/>`;
  }
  let fenetres = '';
  for (const x of [45, 95, 305, 355]) fenetres += `<path d="M${x - 8} 168 V140 A8 8 0 0 1 ${x + 8} 140 V168 Z" fill="#2A1B17" stroke="${ocre}" stroke-width="2.5"/>`;
  let pilastres = '';
  for (const x of [20, 70, 120, 280, 330, 380]) pilastres += `<rect x="${x - 5}" y="99" width="10" height="133" fill="${ocre}"/>`;
  let foule = '';
  const teintes = ['#F3ECDF', '#B3202E', '#1D4E9E', '#E2A93B', '#2E7D57', '#1B1212'];
  for (let r = 0; r < 4; r++) for (let i = 0; i < 22; i++) foule += `<circle cx="${168 + i * 3.1 + (r % 2) * 1.5}" cy="${150 + r * 7}" r="1.4" fill="${teintes[(i * 7 + r * 3) % teintes.length]}"/>`;
  let clous = '';
  for (let yy = 150; yy < 230; yy += 14) for (const xx of [176, 190, 210, 224]) clous += `<circle cx="${xx}" cy="${yy}" r="1.3" fill="${ocre}"/>`;
  let etoiles = '';
  for (let i = 0; i < 26; i++) etoiles += `<circle class="ar-etoile" cx="${(i * 73) % 400}" cy="${(i * 37) % 30 + 4}" r="${i % 3 ? .8 : 1.3}" fill="#FBF7F0"/>`;
  const taille = Math.min(9, 150 / Math.max(6, nom.length));
  return `<svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="ar-ouv"><path d="M168 232 V140 A32 32 0 0 1 232 140 V232 Z"/></clipPath>
      <linearGradient id="ar-ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6C46A"/><stop offset="1" stop-color="#F9E3A8"/></linearGradient>
      <radialGradient id="ar-halo"><stop offset="0" stop-color="#FFD27A" stop-opacity=".75"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    </defs>
    <g>${etoiles}</g>
    <g class="ar-zoom">
      <rect x="-300" y="232" width="1000" height="60" fill="#1A1210"/>
      <path d="M60 46 V20 M340 46 V20" stroke="#BFB6A8" stroke-width="1.6"/>
      <path class="ar-drapeau" d="M60 20 h16 l-4 5 l4 5 h-16 Z" fill="${rouge}"/>
      <path class="ar-drapeau" d="M340 20 h16 l-4 5 l4 5 h-16 Z" fill="${ocre}"/>
      <path d="M-10 46 Q200 32 410 46 L410 53 Q200 39 -10 53 Z" fill="${brique}"/>
      <path d="M-10 53 Q200 39 410 53 L410 92 L-10 92 Z" fill="${cal}"/>
      ${arcs}
      <rect x="-10" y="92" width="420" height="7" fill="${ocre}"/>
      <rect x="-10" y="99" width="420" height="133" fill="${cal}"/>
      ${pilastres}${fenetres}
      <circle cx="136" cy="146" r="18" fill="url(#ar-halo)"/><circle cx="264" cy="146" r="18" fill="url(#ar-halo)"/>
      <circle cx="136" cy="146" r="3.6" fill="#FFE2A0"/><circle cx="264" cy="146" r="3.6" fill="#FFE2A0"/>
      <path d="M140 86 Q200 50 260 86 Z" fill="${ocre}"/>
      <circle cx="200" cy="74" r="8.5" fill="${brique}" stroke="${ocreF}" stroke-width="2"/>
      <path d="M148 232 V98 Q148 86 160 86 H240 Q252 86 252 98 V232 Z" fill="${ocre}"/>
      <rect x="154" y="93" width="92" height="15" rx="2" fill="${brique}"/>
      <text x="200" y="103.5" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="${taille}" letter-spacing=".8" fill="#FBF7F0">${esc(nom)}</text>
      <g clip-path="url(#ar-ouv)">
        <rect x="160" y="100" width="80" height="140" fill="url(#ar-ciel)"/>
        <rect x="160" y="144" width="80" height="34" fill="#8C2F25"/>
        ${foule}
        <rect x="160" y="178" width="80" height="11" fill="#7D1520"/>
        <rect x="160" y="178" width="80" height="2" fill="${ocre}"/>
        <rect x="160" y="189" width="80" height="50" fill="#E8B25C"/>
      </g>
      <g class="ar-porte-g"><path d="M168 232 V140 A32 32 0 0 1 200 108 V232 Z" fill="#5A2318"/><path d="M184 112 V232" stroke="#3E170F" stroke-width="1.5"/>${clous.split('/>').filter(c => /cx="(176|190)"/.test(c)).map(c => c + '/>').join('')}</g>
      <g class="ar-porte-d"><path d="M232 232 V140 A32 32 0 0 0 200 108 V232 Z" fill="#5A2318"/><path d="M216 112 V232" stroke="#3E170F" stroke-width="1.5"/>${clous.split('/>').filter(c => /cx="(210|224)"/.test(c)).map(c => c + '/>').join('')}</g>
      <ellipse class="ar-lueur" cx="200" cy="238" rx="80" ry="9" fill="#F6C46A" opacity="0"/>
    </g>
  </svg>`;
}
function entree() {
  const el = $('#entree');
  if (!el) return Promise.resolve();
  if (!animOn() || mvtReduit.matches) { el.remove(); return Promise.resolve(); }
  const t = S.data ? S.data.trip : SEED.trip;
  const nom = `${t.title || 'Voyage'}${validYmd(t.start) ? ' ' + t.start.slice(0, 4) : ''}`.toUpperCase();
  el.style.animation = 'none';
  el.innerHTML = arenaSvg(nom) + '<p class="entree-passer">Toucher pour entrer</p>';
  return new Promise(fin => {
    let fini = false;
    const terminer = () => {
      if (fini) return;
      fini = true;
      el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, easing: 'ease-out', fill: 'forwards' }).finished.then(() => { el.remove(); fin(); });
    };
    el.addEventListener('click', terminer);
    addEventListener('keydown', terminer, { once: true });
    const zoom = el.querySelector('.ar-zoom');
    zoom.animate([{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 750, easing: 'ease-out', fill: 'backwards' });
    const ouvre = { duration: 750, delay: 950, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' };
    el.querySelector('.ar-porte-g').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(.06)' }], ouvre);
    el.querySelector('.ar-porte-d').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(.06)' }], ouvre);
    el.querySelector('.ar-lueur').animate([{ opacity: 0 }, { opacity: .9 }], ouvre);
    zoom.animate([{ transform: 'scale(1)' }, { transform: 'scale(16)' }], { duration: 1300, delay: 1550, easing: 'cubic-bezier(.55,0,.85,.45)', fill: 'forwards' })
      .finished.then(terminer, terminer);
  });
}

/* ================= Démarrage ================= */
function readHash() {
  if (!location.hash || location.hash.length < 2) return;
  const p = new URLSearchParams(location.hash.slice(1));
  let used = false;
  if (p.get('cle')) { store.set('cle', p.get('cle').trim()); S.justKeyed = true; S.keyRejected = false; used = true; }
  if (p.get('code')) { store.set('code', p.get('code')); used = true; }
  if (used) history.replaceState(null, '', location.pathname + location.search);
}
async function boot() {
  readHash();
  S.tab = TABS.some(t => t[0] === store.get('onglet')) ? store.get('onglet') : 'programme';
  if (MODE === 'local') {
    S.remote = normalize(safeParse(store.get('data')) || clone(SEED));
    S.status = 'local';
    recompute();
  } else {
    const c = safeParse(store.get('cache'));
    if (c && c.data && !S.remote) { S.remote = normalize(c.data); S.sha = c.sha || null; S.missing = !!c.missing; }
    setStatus('loading');
    recompute();
    try {
      await refreshRemote(true);
      recompute();
      setStatus(S.keyRejected ? 'error' : 'ok', S.keyRejected ? describe(new HttpError(401)) : '');
      if (S.keyRejected) toast(describe(new HttpError(401)), 'err');
    } catch (e) {
      setStatus(e instanceof HttpError ? 'error' : 'offline', describe(e));
      render();
    }
    schedulePoll();
  }
  if (S.justKeyed && S.data && !me()) { S.justKeyed = false; openWelcome(); }
}
boot();
majCurseur();
entree().then(() => planParade(3500));

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
